  .popup .address { font-size: 0.72rem; color: #6a6055; margin-bottom: 0.4rem; font-style: italic; }

    "tour": "<p><strong>Founded 778 CE</strong> by the hermit monk Enchin, who had a vision of the bodhisattva Kannon at Otowa Spring. Patronized by the great warlord Sakanoue no Tamuramaro. The current main hall was rebuilt in 1633 by Tokugawa Iemitsu after a fire — over 390 years old. UNESCO World Heritage 1994.</p><p><strong>The wooden stage</strong> juts out 13m above the hillside, supported by 168 zelkova (keyaki) pillars joined with NO nails — Edo-period earthquake-resilient joinery. The Japanese idiom 'to jump off the stage of Kiyomizu' (清水の舞台から飛び降りる) means taking a leap of faith — derived from Edo-era pilgrims who actually jumped, believing Kannon would grant their wish if they survived. (234 documented jumps, 85% survival rate; the practice was banned in 1872.)</p><p><strong>What to look for, in order:</strong></p><p>• <strong>Nio-mon (Deva Gate)</strong> — the orange entrance gate at the top of the approach. Two Nio guardians flanking the entrance, recently restored. The dragon carving on the underside of the eaves.</p><p>• <strong>Three-story pagoda</strong> — 31m tall, vermillion red, one of the tallest three-story pagodas in Japan.</p><p>• <strong>Hondo (Main Hall) wooden stage</strong> — walk out onto it. Look DOWN at the pillar joinery. Look BACK at the temple roof — cypress bark shingles, 3,300 m² of them, replaced every 50 years.</p><p>• <strong>Jishu Shrine</strong> — separate Shinto shrine within the grounds, dedicated to love. Two 'love stones' set 18m apart on the path — walk from one to the other with eyes closed to find love (or have a friend guide you for help).</p><p>• <strong>Otowa Waterfall</strong> at the base — three streams. Choose ONE: longevity (left), success in love (middle), or scholastic success (right). Drinking from all three is considered greedy bad luck.</p><p>• <strong>Saimon (West Gate)</strong> — best sunset view in southwest direction. May twilight ~18:50.</p><p><strong>Exit via Sannenzaka slope</strong> (south side) for the walking-tour spine downhill into Gion.</p>",

    "tour": "<p><strong>Sannenzaka (三年坂)</strong> literally means 'Three-Year Slope.' Two origin stories — pick your favorite:</p><p>(1) The slope was built in the 3rd year of the Daido era (808 CE) during Kiyomizu's construction — practical version.</p><p>(2) The folk version: if you FALL on the slope, you'll die within three years. Hence centuries of pilgrims watching their footing. The cobblestones really are slippery in rain — wear shoes with grip.</p><p><strong>Ninenzaka (二寧坂)</strong> = 'Two-Year Slope' with similar fall-curse legend, built two years earlier in 806 CE. Together with Sannenzaka they're Japan's first nationally-protected historic preservation district (1976).</p><p><strong>What to look for as you walk:</strong></p><p>• <strong>Look UP at the second floors</strong> of the machiya — most are still residential or workshop space. You'll catch glimpses through lattice windows of working artisans, family altars, kimono drying.</p><p>• <strong>Bunshodo (文房堂)</strong> — calligraphy supplies since 1887. Hand-cut bamboo brushes, sumi ink stones, washi paper.</p><p>• <strong>Shoyeido (松栄堂)</strong> — incense maker since 1705. Eight generations of family. They'll let you smell anything.</p><p>• <strong>Side alleys off Sannenzaka</strong> — duck into the narrow openings. Most lead to quiet residential lanes with small shrines or temple gates. Far fewer tourists 10m off the main slope.</p><p>• <strong>The polished stones</strong> — center of each step is worn into a smooth concave from a thousand years of foot traffic. Run a hand along them.</p><p>• <strong>The Yasaka Pagoda</strong> appears framed at the bottom of Yasaka-no-To slope — pause at the corner where the slope opens up. THE iconic Kyoto postcard angle. Pre-dawn or dusk = no people in frame.</p><p><strong>Heads up:</strong> Kasagi-ya (1914 traditional sweet shop, often photographed) is on Ninenzaka — pretty but Instagram-flagged, you can walk past it without stopping.</p>",

    "known": "1440 construction; 46m tall; the iconic Kyoto photo backdrop; rare medieval interior access.",
    "tour": "<p><strong>Founded 589 CE</strong> by Prince Shotoku, who saw a vision of the bodhisattva Kannon at this site. The pagoda you see is from 1440 — 585 years old — making it Hokan-ji's only surviving structure. The rest of the original temple complex burned in 1185 (Genpei War) and again in 1296.</p><p><strong>What to look for:</strong></p><p>• <strong>The central pillar (shinbashira 心柱)</strong> — visible inside on rare open days. It's a free-hanging central column that absorbs earthquake shock by oscillating opposite to the pagoda body. Japanese carpenters perfected this technique by 600 CE — the same principle is used today in Tokyo Skytree.</p><p>• <strong>Kumimono brackets</strong> — the complex multi-tier wooden brackets supporting each roof level, all joined without nails. Look at the corner: the brackets fan out at increasing angles, transferring the roof load down to the central pillar.</p><p>• <strong>The photo angle</strong> — from Yasaka-no-To slope about 100m down, the pagoda frames perfectly with traditional rooflines. Late afternoon (16:00-17:00) gives warm side-light. Pre-dawn empty.</p><p>• <strong>The bell</strong> at the base — Edo period, rung at New Year's and during memorial services.</p><p><strong>Interior access:</strong> The pagoda interior opens occasionally for paid entry (¥400) — Saturdays and special days, weather-dependent. Walk past first and check if the gate is open; if so, it's worth the climb for the central-pillar view (steep wooden steps to the second level).</p>",

    "tour": "<p><strong>Founded 1606</strong> by Nene (born Sugihara Yasu, posthumously named Kodai-in), widow of Toyotomi Hideyoshi — the warlord who unified Japan in 1590 after a century of civil war. Hideyoshi died in 1598; Nene retreated to this temple to memorialize him and spend her remaining years here (she died 1624, age 75, buried on site).</p><p><strong>What to look for, in walking order:</strong></p><p>• <strong>Entrance approach</strong> — stone-paved path through a moss garden. Look for the small stone Jizo statues hidden among the moss.</p><p>• <strong>Hojo (abbot's quarters)</strong> — the main building. Faces a karesansui (dry rock garden) — raked white gravel suggesting water flow, with carefully placed stones representing islands.</p><p>• <strong>The wave-pattern Zen garden</strong> behind Hojo — geometric raked patterns, raked weekly by the monks.</p><p>• <strong>Otama-ya (sanctuary)</strong> — interior is the artistic centerpiece. The walls and altar are decorated in <strong>Kodai-ji maki-e</strong>: gold-leaf lacquerwork by master craftsmen of the early Edo period. Considered some of the finest surviving Momoyama-era lacquer in Japan. The black background + gold leaf + raised relief technique is uniquely Kodai-ji's signature.</p><p>• <strong>The bridge over the pond</strong> — connects different garden zones. Look down for koi.</p><p>• <strong>Kasa-tei and Shigure-tei tea houses</strong> — designed by Sen no Rikyu, the 16th-century tea master who codified the Japanese tea ceremony. Kasa-tei has a unique umbrella-shape (kasa) ceiling. Shigure-tei is a two-story tea house — the only one in Japan.</p><p>• <strong>The bamboo grove</strong> at the back — smaller than Arashiyama but a real living grove, with stone Buddhas tucked along the path. Quieter, almost no one finds it.</p><p><strong>Connection:</strong> Just south of Kodai-ji is Entoku-in (separate ¥500 entry), Nene's living quarters — even quieter, even fewer tourists. Skip unless you have time.</p>",

    "tour": "<p><strong>Yasaka Shrine (八坂神社)</strong> founded 656 CE. Originally called Gion Shrine — the entire Gion district is named after it. Central to the <strong>Gion Matsuri</strong>, started 869 CE as a plague-purification ritual: a series of yamaboko floats paraded through the streets to appease the disease-spirits during a deadly epidemic. The modern Gion Matsuri held every July is one of Japan's biggest festivals — 1,150+ years continuous.</p><p>The vermillion-red main hall (Honden) you see is from 1654, rebuilt after a fire. Unusual roof structure: inner sanctuary and worship hall share one single roof — this is the 'Gion-zukuri' architectural style, found almost nowhere else in Japan.</p><p><strong>What to look for:</strong></p><p>• <strong>Romon (West Gate)</strong> — vermillion two-story gate facing the east end of Shijo-dori. THE iconic Yasaka facade. Recently restored 2020.</p><p>• <strong>Bishamondo lanterns</strong> at dusk — hundreds of paper lanterns donated by Gion businesses, each bearing the donor's name. Lit nightly. Walk the perimeter as the sun sets.</p><p>• <strong>Otabisho</strong> (portable shrine storage) — the big yamaboko floats live here between July festivals. Peek through the gates.</p><p>• <strong>The 'Beauty Water' (Bijin-sui) fountain</strong> at Utsukushi Gozen Shrine — sub-shrine within the grounds. Touch water to your face for beauty. Yes, every local does it.</p><p><strong>Maruyama Park</strong>, just behind:</p><p>• <strong>The weeping cherry tree (Gion no Yozakura 祇園の夜桜)</strong> — most-photographed sakura tree in Kyoto. ~70 years old (the original tree was famous for centuries until it died in 1947; this is a successor planted from the original's seeds). May = leafy green canopy, not pink.</p><p>• <strong>Kyoto's first public park</strong> (1886, Meiji era) — converted from temple grounds. Stone lanterns and waterfall toward the back.</p><p>• <strong>The bench area</strong> overlooking the pond — sit, watch locals, recover from the temple walk.</p>",

    "what": "Founded 1202 by Eisai, the monk who brought Zen Buddhism AND TEA SEEDS from China to Japan. Kyoto's OLDEST Zen temple; one of the Kyoto Five Mountains.",

    "tour": "<p><strong>Founded 1202</strong> by the Zen monk Myoan Eisai — the central figure in two Japanese cultural revolutions. Eisai had traveled to Song-dynasty China twice (1168, 1187-1191) and brought back two things that reshaped Japan: (1) Rinzai Zen Buddhism, which would become the spiritual backbone of samurai culture; and (2) <strong>tea seeds</strong>, which he planted at this temple. Kennin-ji is the birthplace of Japanese tea culture — without it, no matcha, no tea ceremony, no Sen no Rikyu.</p><p>Eisai wrote his famous treatise <em>Kissa Yojoki</em> ('Drink Tea for Health') here in 1211. Opening line: 'Tea is the most wonderful medicine for maintaining one's health.' He gave the treatise to the shogun Minamoto no Sanetomo to cure his hangover. The shogun was convinced. Tea spread through samurai culture from there.</p><p>One of the Kyoto Gozan (Five Mountains) — the five top-ranked Zen temples in the medieval ranking system established by the Ashikaga shogunate.</p><p><strong>What to look for, in walking order:</strong></p><p>• <strong>Hatto (Dharma Hall) — TWIN DRAGONS CEILING</strong>. The main hall's ceiling is painted with two intertwined dragons by <strong>Koizumi Junsaku</strong>, completed 2002 to commemorate the temple's 800th anniversary. 11.4m × 15.7m on washi paper — 108 tatami mats worth of space. Lie back on the tatami and look up. The dragons represent yin and yang.</p><p>• <strong>Fujin Raijin-zu screens (Wind God / Thunder God)</strong> — painted early 17th century by <strong>Tawaraya Sotatsu</strong>, founder of the Rinpa school of Japanese painting. Designated National Treasures. The gold-leaf folding screen with the green Wind God blowing his wind-bag and the white Thunder God beating his drum is one of the most-copied images in Japanese art history — appears on everything from postage stamps to bento boxes. The originals you see are reproductions; the originals are in Kyoto National Museum (rotated).</p><p>• <strong>Cho-on-tei stone garden</strong> — geometric arrangement representing the Buddha (central rock) and his attendants. Sit on the wooden engawa (porch) and look — different angles give different compositions.</p><p>• <strong>Soto-style karesansui (dry garden)</strong> in the south courtyard — raked gravel with stones, classic Zen meditation aid.</p><p>• <strong>Eisai's tea-seed memorial stone</strong> in the back grounds, near the small shrine to the temple founder. Easy to miss — ask a monk.</p><p>• <strong>The temple gates</strong> — Chokushimon (Imperial Messenger Gate), 13th century, considered one of the finest medieval temple gates in Kyoto.</p>",

// Business-name links (NOT coordinates) — opens the actual business listing
function appleMapsLink(p) {
  const q = p.address ? (p.name + ', ' + p.address) : p.name;
  return 'https://maps.apple.com/?q=' + encodeURIComponent(q);
}
function googleMapsLink(p) {
  const q = p.address ? (p.name + ', ' + p.address) : p.name;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}

// ===== MAP VIEW =====
const map = L.map('map').setView([35.06140782608695, 136.12254826086956], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);

const groups = { locked: L.layerGroup(), major: L.layerGroup(), bonus: L.layerGroup(), station: L.layerGroup() };

PINS.forEach(p => {
  const icon = L.divIcon({
    className: '',
    html: '<div class="pin ' + p.cat + '">' + p.label + '</div>',
    iconSize: p.cat === 'locked' ? [36, 36] : (p.cat === 'major' ? [28, 28] : [22, 22]),
    iconAnchor: p.cat === 'locked' ? [18, 18] : (p.cat === 'major' ? [14, 14] : [11, 11])
  });
  const marker = L.marker([p.lat, p.lon], { icon });

  const sections = [];
  const badgeLabel = p.cat === 'locked' ? 'LOCKED' : p.cat === 'major' ? 'planned' : p.cat === 'bonus' ? 'discovery' : 'station';
  sections.push('<span class="badge ' + p.cat + '">' + badgeLabel + '</span>');
  sections.push('<h3>' + p.name + '</h3>');
  if (p.when) sections.push('<div class="when">' + p.when + '</div>');
  if (p.booking) sections.push('<div class="booking">' + p.booking + '</div>');
  if (p.what) sections.push('<div class="what"><span class="section-label">What it is — </span>' + p.what + '</div>');
  if (p.why) sections.push('<div class="why"><span class="section-label">Why for you — </span>' + p.why + '</div>');
  if (p.known) sections.push('<div class="known"><span class="section-label">Known for — </span>' + p.known + '</div>');
  if (p.address) sections.push('<div class="address">' + p.address + '</div>');
  if (p.walk) sections.push('<div class="walk">↪ ' + p.walk + '</div>');
  sections.push('<a class="nav-link" href="' + appleMapsLink(p) + '" target="_blank">Apple Maps →</a>');
  sections.push('<a class="nav-link" href="' + googleMapsLink(p) + '" target="_blank">Google Maps →</a>');
  if (p.book) sections.push('<br><a class="book-link" href="' + p.book + '" target="_blank">Book / reserve →</a>');

  marker.bindPopup('<div class="popup">' + sections.join('') + '</div>');
  groups[p.cat].addLayer(marker);
});

groups.locked.addTo(map);
groups.major.addTo(map);
groups.bonus.addTo(map);
groups.station.addTo(map);

const all = PINS.map(p => [p.lat, p.lon]);
if (all.length) map.fitBounds(all, { padding: [30, 30] });

['locked', 'major', 'bonus', 'station'].forEach(cat => {
  document.getElementById('show-' + cat).addEventListener('change', e => {
    if (e.target.checked) groups[cat].addTo(map);
    else map.removeLayer(groups[cat]);
  });
});

// ===== LIST VIEW =====
const listView = document.getElementById('list-view');
const categories = [
  { cat: 'locked', title: 'Locked — confirmed bookings / hard anchors' },
  { cat: 'major', title: 'Planned — the day spine' },
  { cat: 'bonus', title: 'Discovery — wander if time allows' },

let listHtml = '';
categories.forEach(({ cat, title }) => {
  const pins = PINS.filter(p => p.cat === cat);
  if (!pins.length) return;
  listHtml += '<div class="list-section">';
  listHtml += '<div class="list-section-header ' + cat + '">' + title + ' <span class="count">' + pins.length + '</span></div>';
  pins.forEach(p => {
    const parts = [];
    parts.push('<span class="label-badge ' + cat + '">' + p.label + '</span>');
    parts.push('<span class="name">' + p.name + '</span>');
    if (p.when) parts.push('<div class="when">' + p.when + '</div>');
    if (p.booking) parts.push('<div class="booking">' + p.booking + '</div>');
    if (p.what) parts.push('<div class="what"><span class="section-label">What it is — </span>' + p.what + '</div>');
    if (p.why) parts.push('<div class="why"><span class="section-label">Why for you — </span>' + p.why + '</div>');
    if (p.known) parts.push('<div class="known"><span class="section-label">Known for — </span>' + p.known + '</div>');
    if (p.tour) parts.push('<div class="tour"><span class="tour-label">📖 Walking-tour notes</span>' + p.tour + '</div>');
    if (p.address) parts.push('<div class="address">📍 ' + p.address + '</div>');
    if (p.walk) parts.push('<div class="walk">↪ ' + p.walk + '</div>');

    let links = '<div class="links">';
    links += '<a class="apple" href="' + appleMapsLink(p) + '" target="_blank">Apple Maps</a>';
    links += '<a class="google" href="' + googleMapsLink(p) + '" target="_blank">Google Maps</a>';
    if (p.book) links += '<a class="book" href="' + p.book + '" target="_blank">Book / reserve →</a>';
    links += '</div>';
    parts.push(links);

    listHtml += '<div class="list-card">' + parts.join('') + '</div>';
  });
  listHtml += '</div>';
});
listView.innerHTML = listHtml;

// ===== TAB SWITCHING =====
const mapEl = document.getElementById('map');
const legend = document.getElementById('legend');
const tabMap = document.getElementById('tab-map');
const tabList = document.getElementById('tab-list');

function showMap() {
  tabMap.classList.add('active');
  tabList.classList.remove('active');
  mapEl.classList.remove('hidden');
  listView.classList.remove('active');
  legend.style.display = '';
  setTimeout(() => map.invalidateSize(), 50);
}
function showList() {
  tabList.classList.add('active');
  tabMap.classList.remove('active');
  mapEl.classList.add('hidden');
  listView.classList.add('active');
  legend.style.display = 'none';
}
tabMap.addEventListener('click', showMap);
tabList.addEventListener('click', showList);

// ===== LIVE LOCATION =====
let userMarker = null, userCircle = null, watchId = null, firstFix = true;
const locateBtn = document.getElementById('locate');

function startTracking() {
  if (!navigator.geolocation) { alert('Geolocation not supported on this device.'); return; }
  locateBtn.textContent = '📍 Locating…';
  firstFix = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);
    userMarker = L.marker([latitude, longitude], {
      icon: L.divIcon({ className: '', html: '<div class="pin you"></div>', iconSize: [18,18], iconAnchor: [9,9] })
    }).addTo(map);
    userCircle = L.circle([latitude, longitude], {
      radius: accuracy, color: '#2A8C4F', fillColor: '#2A8C4F', fillOpacity: 0.1, weight: 1
    }).addTo(map);
    if (firstFix) {
      map.setView([latitude, longitude], Math.max(map.getZoom(), 15));
      firstFix = false;
    }
    locateBtn.textContent = '📍 Re-center';
  }, err => {
    alert('Location error: ' + err.message);
    locateBtn.textContent = '📍 Where am I';
    watchId = null;
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
}

locateBtn.addEventListener('click', () => {
  if (watchId === null) startTracking();
  else if (userMarker) map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 15));
});
</script>
