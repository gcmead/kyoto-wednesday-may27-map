  .locate-btn:active { background: var(--red); }
  #map { flex: 1; }
  .leaflet-popup-content-wrapper { border-radius: 6px; padding: 0; }
  .leaflet-popup-content { margin: 0; min-width: 260px; max-width: 320px; }
  .popup { padding: 0.9rem 1rem; font-family: var(--sans); font-size: 0.82rem; line-height: 1.5; }

  .popup .badge.major { background: #F5E0D2; color: #6b3a1c; }
  .popup .badge.bonus { background: #DBE5F0; color: #1f4570; }
  .popup .badge.station { background: #E6DFD0; color: #4a4540; }

  .popup .when { font-size: 0.72rem; color: var(--red); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 0.5rem; }
  .popup .booking { font-size: 0.72rem; background: #FBF1D5; padding: 0.4rem 0.5rem; border-radius: 3px; margin-bottom: 0.6rem; color: #5a3e10; }
  .popup .what, .popup .why, .popup .known { font-size: 0.78rem; color: #4a4540; margin-bottom: 0.5rem; }
  .popup .section-label { font-weight: 700; color: var(--ink); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; }
  .popup .walk { font-size: 0.75rem; color: #5E7F4B; font-weight: 600; margin-top: 0.5rem; margin-bottom: 0.3rem; }
  .popup .address { font-size: 0.72rem; color: #6a6055; margin-bottom: 0.4rem; font-style: italic; }
  .popup .nav-link { display: inline-block; margin-top: 0.3rem; margin-right: 0.6rem; font-size: 0.72rem; color: var(--red); text-decoration: none; font-weight: 600; letter-spacing: 0.3px; }
  .popup .book-link { display: inline-block; margin-top: 0.3rem; font-size: 0.72rem; color: var(--blue); text-decoration: none; font-weight: 600; letter-spacing: 0.3px; }
  .pin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: var(--sans); font-size: 0.7rem; font-weight: 700;

  .pin.major { background: var(--red); }
  .pin.bonus { background: var(--blue); width: 22px; height: 22px; font-size: 0.6rem; }
  .pin.station { background: white; color: var(--ink); border: 2px solid var(--ink); width: 22px; height: 22px; font-size: 0.6rem; }

const map = L.map('map').setView([35.07615263157895, 136.1901947368421], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19
}).addTo(map);

const groups = { locked: L.layerGroup(), major: L.layerGroup(), bonus: L.layerGroup(), station: L.layerGroup() };

function appleMapsLink(lat, lon, name) {
  return 'https://maps.apple.com/?q=' + encodeURIComponent(name) + '&ll=' + lat + ',' + lon;
}
function googleMapsLink(lat, lon, name) {
  return 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon + '&query_place_id=' + encodeURIComponent(name);
}

PINS.forEach(p => {
  const icon = L.divIcon({
    className: '',
    html: '<div class="pin ' + p.cat + '">' + p.label + '</div>',
    iconSize: p.cat === 'locked' ? [36, 36] : (p.cat === 'major' ? [28, 28] : [22, 22]),
    iconAnchor: p.cat === 'locked' ? [18, 18] : (p.cat === 'major' ? [14, 14] : [11, 11])
  });
  const marker = L.marker([p.lat, p.lon], { icon });

  const sections = [];
  const badgeLabel = p.cat === 'locked' ? 'LOCKED' : p.cat === 'major' ? 'planned' : p.cat === 'bonus' ? 'discovery' : 'station';
  sections.push('<span class="badge ' + p.cat + '">' + badgeLabel + '</span>');
  sections.push('<h3>' + p.name + '</h3>');
  if (p.when) sections.push('<div class="when">' + p.when + '</div>');
  if (p.booking) sections.push('<div class="booking">' + p.booking + '</div>');
  if (p.what) sections.push('<div class="what"><span class="section-label">What it is — </span>' + p.what + '</div>');
  if (p.why) sections.push('<div class="why"><span class="section-label">Why for you — </span>' + p.why + '</div>');
  if (p.known) sections.push('<div class="known"><span class="section-label">Known for — </span>' + p.known + '</div>');
  if (p.address) sections.push('<div class="address">' + p.address + '</div>');
  if (p.walk) sections.push('<div class="walk">↪ ' + p.walk + '</div>');
  if (p.cat !== 'station') {
    sections.push('<a class="nav-link" href="' + appleMapsLink(p.lat, p.lon, p.name) + '" target="_blank">Apple Maps →</a>');
    sections.push('<a class="nav-link" href="' + googleMapsLink(p.lat, p.lon, p.name) + '" target="_blank">Google Maps →</a>');
  }
  if (p.book) sections.push('<br><a class="book-link" href="' + p.book + '" target="_blank">Book / reserve →</a>');

  marker.bindPopup('<div class="popup">' + sections.join('') + '</div>');
  groups[p.cat].addLayer(marker);
});

groups.locked.addTo(map);
groups.major.addTo(map);
groups.bonus.addTo(map);
groups.station.addTo(map);

const all = PINS.map(p => [p.lat, p.lon]);
if (all.length) map.fitBounds(all, { padding: [30, 30] });

['locked', 'major', 'bonus', 'station'].forEach(cat => {
  document.getElementById('show-' + cat).addEventListener('change', e => {
    if (e.target.checked) groups[cat].addTo(map);
    else map.removeLayer(groups[cat]);
  });
});

// Live location — first-fix-center-only; tap button to re-center on demand
let userMarker = null, userCircle = null, watchId = null, firstFix = true;
const locateBtn = document.getElementById('locate');

function startTracking() {
  if (!navigator.geolocation) { alert('Geolocation not supported on this device.'); return; }
  locateBtn.textContent = '📍 Locating…';
  firstFix = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    if (userMarker) map.removeLayer(userMarker);
    if (userCircle) map.removeLayer(userCircle);
    userMarker = L.marker([latitude, longitude], {
      icon: L.divIcon({ className: '', html: '<div class="pin you"></div>', iconSize: [18,18], iconAnchor: [9,9] })
    }).addTo(map);
    userCircle = L.circle([latitude, longitude], {
      radius: accuracy, color: '#2A8C4F', fillColor: '#2A8C4F', fillOpacity: 0.1, weight: 1
    }).addTo(map);
    if (firstFix) {
      map.setView([latitude, longitude], Math.max(map.getZoom(), 15));
      firstFix = false;
    }
    locateBtn.textContent = '📍 Re-center';
  }, err => {
    alert('Location error: ' + err.message);
    locateBtn.textContent = '📍 Where am I';
    watchId = null;
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
}

locateBtn.addEventListener('click', () => {
  if (watchId === null) startTracking();
  else if (userMarker) map.setView(userMarker.getLatLng(), Math.max(map.getZoom(), 15));
});
</script>

</body>
</html>
